<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BS5 Tables and Images</title>

    <!--CSS-->
    <link rel="stylesheet" type="text/css" href="style.css">

    <!-- Latest compiled and minified CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Latest compiled JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</head>
<body>
    
    <table class="table table-bordered">
        <!-- TABLE HEADER -->
         <thead>
        <tr class="table-dark">
            <th>PROFILE</th>
            <th>NAME</th>
            <th>BIRTHDAY</th>
        </tr>
         </thead>

         <tbody>
        <!-- RECORD 1 -->
        <tr class="table-primary text-center">
            <td><img class="rounded-circle" src="Alta.jpg" alt="Profile"></td>
            <td>Alta Aragones</td>
            <td>June 16, 2012</td>
        </tr>

        <!-- RECORD 2 -->
        <tr class="table-info text-center">
            <td><img class="rounded-circle" src="Screenshot 2026-10-20 082853.png" alt="Profile"></td>
            <td>Justine Lim</td>
            <td>April 24, 2012</td>
        </tr>

        <!-- RECORD 3 -->
        <tr class="table-warning text-center">
            <td> <img src="" alt=""></td>
            <td>Vivienne Dimayacyac</td>
            <td>March 12, 2012</td>
        </tr>

        <!-- RECORD 4 -->
        <tr class="table-success text-center">
            <td><img class="rounded-circle" src="Screenshot 2026-10-20 084111.png" alt=""></td>
            <td>Zhaimer Mamacotao</td>
            <td>October 12, 2013</td>
        </tr>

        <!-- RECORD 5 -->
        <tr class="table-danger text-center">
            <td><img class="rounded-circle" src="Screenshot 2026-10-20 083423.png" alt=""></td>
            <td>Summer Zapanta</td>
            <td>November 8, 2011</td>
        </tr>
          </tbody>
    </table>
    
</body>
</html>
